version: "3.9"
services:
  db:
    image: postgres:16
    container_name: phonics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       phonics
      POSTGRES_USER:     phonics
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - phonics_db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonics -d phonics"]
      interval: 10s
      timeout: 5s
      retries: 5
  bot:
    build: .
    container_name: phonics_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_TOKEN:    ${TELEGRAM_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY:    ${OPENAI_API_KEY}
      DATABASE_URL:      postgresql://phonics:${DB_PASSWORD}@db:5432/phonics
      DAILY_TIP_HOUR:    ${DAILY_TIP_HOUR:-11}
      DAILY_TIP_MINUTE:  ${DAILY_TIP_MINUTE:-0}
    volumes:
      - phonics_data:/app/data
volumes:
  phonics_db_data:
  phonics_data:
